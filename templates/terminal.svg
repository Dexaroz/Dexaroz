<svg xmlns="http://www.w3.org/2000/svg" width="900" height="346" viewBox="0 0 900 346" role="img" aria-labelledby="title description">
  <title id="title">{{HANDLE}} terminal profile</title>
  <desc id="description">ASCII art and a summary of {{NAME}}'s role and technologies.</desc>
  <defs>
    <linearGradient id="screen" x2="0" y2="1">
      <stop stop-color="#29221e"/>
      <stop offset="1" stop-color="#1c1917"/>
    </linearGradient>
    <linearGradient id="scan" x2="0" y2="1">
      <stop stop-color="#ff7846" stop-opacity="0"/>
      <stop offset=".42" stop-color="#ff7846" stop-opacity=".17"/>
      <stop offset=".5" stop-color="#ffc49e" stop-opacity=".48"/>
      <stop offset=".58" stop-color="#ff7846" stop-opacity=".17"/>
      <stop offset="1" stop-color="#ff7846" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="346" rx="18" fill="#1b1816"/>
  <path d="M18 0h864a18 18 0 0 1 18 18v27H0V18A18 18 0 0 1 18 0Z" fill="#2b221d"/>
  <circle cx="22" cy="23" r="4" fill="#ff7140"/>
  <circle cx="37" cy="23" r="4" fill="#e6a36f"/>
  <circle cx="52" cy="23" r="4" fill="#e2c9ad"/>
  <text x="450" y="27" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#d4b5a1">{{HANDLE_LOWER}}@github ~ /profile</text>
  <rect x="18" y="62" width="390" height="264" rx="10" fill="url(#screen)" stroke="#674d3f"/>
  <rect x="420" y="62" width="462" height="264" rx="10" fill="url(#screen)" stroke="#674d3f"/>
  <rect x="18" y="66" width="864" height="28" fill="url(#scan)">
    <animate attributeName="y" values="66;291;66" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="36" y="87" font-family="Consolas, monospace" font-size="12" letter-spacing="1" fill="#ff9063">VISUAL.MAP</text>
  {{ASCII}}
  <text x="36" y="289" font-family="Consolas, monospace" font-size="13" fill="#ff9063">{{TAGLINE}}</text>
  <text x="440" y="87" font-family="Consolas, monospace" font-size="12" letter-spacing="1" fill="#ff9063">SYSTEM.INFO</text>
  <g font-family="Consolas, monospace" font-size="14">
    <text x="440" y="129" fill="#caad9b">name<tspan fill="#c2a18e">............</tspan></text><text x="580" y="129" fill="#fff4eb">{{NAME}}</text>
    <text x="440" y="165" fill="#caad9b">handle<tspan fill="#c2a18e">..........</tspan></text><text x="580" y="165" fill="#fff4eb">@{{HANDLE}}</text>
    <text x="440" y="201" fill="#caad9b">role<tspan fill="#c2a18e">............</tspan></text><text x="580" y="201" fill="#fff4eb">{{TERMINAL_ROLE}}</text>
    <text x="440" y="237" fill="#caad9b">languages<tspan fill="#c2a18e">.......</tspan></text><text x="580" y="237" fill="#fff4eb">{{LANGUAGES}}</text>
    <text x="440" y="273" fill="#caad9b">frontend<tspan fill="#c2a18e">........</tspan></text><text x="580" y="273" fill="#fff4eb">{{FRONTEND}}</text>
    <text x="440" y="309" fill="#caad9b">backend &amp; APIs<tspan fill="#c2a18e">..</tspan></text><text x="580" y="309" fill="#fff4eb">{{BACKEND}}</text>
  </g>
  <rect x=".5" y=".5" width="899" height="345" rx="17.5" fill="none" stroke="#715545"/>
</svg>
