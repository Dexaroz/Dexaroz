<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180" role="img" aria-labelledby="title description">
  <title id="title">{{NAME}} — {{HANDLE}}</title>
  <desc id="description">Developer profile banner in warm orange tones.</desc>
  <defs>
    <linearGradient id="panel" x2="1" y2="1">
      <stop stop-color="#30231e"/>
      <stop offset="1" stop-color="#201c19"/>
    </linearGradient>
    <radialGradient id="light">
      <stop stop-color="#ff713e" stop-opacity=".24"/>
      <stop offset="1" stop-color="#ff713e" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="avatarClip"><rect x="42" y="40" width="100" height="100" rx="12"/></clipPath>
  </defs>
  <rect width="900" height="180" rx="20" fill="#1b1816"/>
  <rect x="18" y="18" width="864" height="144" rx="15" fill="url(#panel)" stroke="#655044"/>
  <ellipse cx="690" cy="45" rx="250" ry="125" fill="url(#light)"/>
  <image href="{{AVATAR}}" x="42" y="40" width="100" height="100" clip-path="url(#avatarClip)"/>
  <rect x="42" y="40" width="100" height="100" rx="12" fill="none" stroke="#ff7846" stroke-width="2"/>
  <text x="153" y="66" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="2" fill="#ff9063">@{{HANDLE_UPPER}}</text>
  <text x="151" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700" fill="#fff8f2">{{NAME}}</text>
  <text x="153" y="142" xml:space="preserve" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#d8c7bd">{{ROLE}}</text>
</svg>
