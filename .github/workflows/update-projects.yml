name: Update pinned projects

on:
  schedule:
    - cron: '2/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Render pinned projects
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_projects.py
      - name: Commit when changed
        run: |
          if git diff --quiet -- assets/projects.svg; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/projects.svg
          git commit -m 'Update pinned projects'
          git push
